<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SessionMiddleware</title>
</head>
<body>
    <h2>發送 Requests 測試結果</h2>
    <div>
        <button onclick="hello()">hello</button>
        <button onclick="talk()">talk</button>
    </div>
</body>
</html>

<script>
    async function hello() {
        let response = await fetch("/hello?name=Jeter", {
            method: "GET"
        });
        let result = await response.json();
        console.log(result);
    }

    async function talk() {
        let response = await fetch("/talk", {
            method: "GET"
        });
        let result = await response.json();
        console.log(result);
    }
</script>
